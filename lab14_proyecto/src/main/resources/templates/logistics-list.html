<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Logística y Viajes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; margin: 40px; }
        h1 { color: #f0c040; text-align: center; }
        .container { max-width: 1000px; margin: auto; background: #16213e; padding: 30px; border-radius: 12px; border: 1px solid #4a90d9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { background: #0f3460; color: #f0c040; }
        a.btn { background: #4a90d9; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; }
        a.btn-danger { background: #d9534f; }
        a.btn:hover { opacity: 0.9; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>Listado de Viajes y Logística</h1>
            <a href="/logistics/nuevo" class="btn">+ Nuevo Registro</a>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Operador</th>
                    <th>Origen</th>
                    <th>Destino</th>
                    <th>Tarifa</th>
                    <th>Fecha</th>
                    <th>Estatus</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reg : ${registros}">
                    <td th:text="${reg.id}"></td>
                    <td th:text="${reg.operador}"></td>
                    <td th:text="${reg.origen}"></td>
                    <td th:text="${reg.destino}"></td>
                    <td th:text="'$' + ${reg.tarifa}"></td>
                    <td th:text="${reg.fechaViaje}"></td>
                    <td th:text="${reg.estatus}"></td>
                    <td>
                        <a th:href="@{/logistics/editar/{id}(id=${reg.id})}" class="btn">Editar</a>
                        <a th:href="@{/logistics/eliminar/{id}(id=${reg.id})}" class="btn btn-danger" onclick="return confirm('¿Estás seguro de eliminar este registro?');">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
